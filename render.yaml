services:
  - type: web
    name: ombrix-mcp
    runtime: node
    plan: free
    region: oregon
    # No build step needed - index.js is pre-bundled (zero dependencies)
    buildCommand: "echo 'Using pre-bundled index.js - no build needed'"
    startCommand: "node spaces/huggingface/index.js"
    envVars:
      - key: PORT
        value: 10000
      - key: MCP_TRANSPORT
        value: sse
      - key: NODE_ENV
        value: production
    healthCheckPath: /health
    autoDeploy: true
    # Render free tier: 750 hours/month, spins down after 15min inactivity
    # First request after spin-down: ~30s cold start
    # Upgrade to Starter ($7/mo) for always-on

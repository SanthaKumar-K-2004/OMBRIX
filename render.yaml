services:
  - type: web
    name: ombrix-mcp
    runtime: node
    plan: free
    region: oregon
    buildCommand: "node -e 'console.log(\"Build OK\")'"
    startCommand: "node spaces/huggingface/index.js"
    envVars:
      - key: PORT
        value: 10000
      - key: MCP_TRANSPORT
        value: sse
      - key: NODE_ENV
        value: production
    healthCheckPath: /health
    autoDeploy: true

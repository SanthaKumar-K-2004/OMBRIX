name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome Linter & Formatter Check
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run Core Test Suite
        run: pnpm run test

      - name: Build Web Application
        run: pnpm run build

      - name: Build CLI & MCP Server Binaries
        run: node scripts/build-tools.mjs

      - name: Verify CLI Binary
        run: node packages/cli/dist/bin.js --help

      - name: Verify MCP Server Binary Handshake
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | node packages/mcp-server/dist/index.js


name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag (default: latest)'
        required: true
        default: 'latest'

jobs:
  publish-npm:
    name: Publish Packages to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and Package Releases
        run: node scripts/prepare-publish.mjs

      - name: Publish to npm Registry
        run: |
          for tgz in releases/*.tgz; do
            echo "Publishing $tgz..."
            npm publish "$tgz" --access public --tag "${{ github.event.inputs.tag || 'latest' }}"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
